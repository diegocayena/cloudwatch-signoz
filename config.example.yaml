interval_seconds: 3600
ebs_interval_seconds: 86400
discovery_interval_seconds: 3600
lookback_seconds: 7200
log_level: INFO

signoz:
  endpoint: https://ingest.<REGION>.signoz.cloud:443
  ingestion_key: ${SIGNOZ_INGESTION_KEY}

targets:
  # A conta e todas as regiões são carregadas do arquivo .env.
  # Sem role_arn, o boto3 usa diretamente a Access Key informada.
  - account: ${AWS_ACCOUNT_ID}
    regions: ${AWS_REGIONS}

  # Para outra conta, informe uma lista de regiões e uma role que a
  # credencial-base possa assumir:
  # - account: "222222222222"
  #   regions: sa-east-1,us-east-1
  #   role_arn: arn:aws:iam::222222222222:role/CloudWatchSigNozReadOnly